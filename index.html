<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>냥냥 수학 놀이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #4a3434;
      --pink: #ff8fab;
      --sky: #7cc8f8;
      --lemon: #ffd65c;
      --cream: #fff8ef;
      --font: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #fff 0 6px, transparent 7px) 0 0 / 120px 120px,
        linear-gradient(180deg, #ffe3ea 0%, #ffeef3 55%, #dff3ff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      user-select: none;
      -webkit-user-select: none;
    }
    header { width: min(1180px, 100%); display: flex; align-items: center; justify-content: flex-end; }
    .coins {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; border: 4px solid var(--ink); border-radius: 20px;
      box-shadow: 0 5px 0 var(--ink);
      padding: 6px 16px 6px 10px; font-size: 26px;
    }
    .coin { width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--ink);
      background: radial-gradient(circle at 35% 35%, #fff4b0 0 22%, #ffd23f 23% 100%); }
    h1 {
      margin: 10px 0 2px;
      font-size: clamp(40px, 9vw, 72px);
      font-weight: normal;
      color: #ff5c8a;
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      text-shadow: 0 5px 0 var(--ink);
      text-align: center;
      text-wrap: balance;
    }
    h1 span { color: var(--lemon); }
    .sub { font-size: clamp(20px, 4.5vw, 30px); margin: 10px 0 24px; text-align: center; }
    .cards {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: clamp(18px, 4vw, 34px);
    }
    .card {
      display: flex; flex-direction: column; align-items: center;
      text-decoration: none; color: var(--ink);
      border: 6px solid var(--ink);
      border-radius: 36px;
      box-shadow: 0 10px 0 var(--ink);
      padding: 22px 20px 24px;
      transition: transform .08s, box-shadow .08s;
      min-width: 0;
    }
    .card:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); }
    .card:focus-visible { outline: 5px solid #fff; outline-offset: 4px; }
    .card.candy { background: linear-gradient(180deg, #ffc9d6, #ff9fb8); }
    .card.penguin { background: linear-gradient(180deg, #d4efff, #8fd0f7); }
    .card.kitchen { background: linear-gradient(180deg, #ffe7b3, #ffc46b); }
    .art {
      width: 100%; max-width: 320px; aspect-ratio: 16 / 10;
      background: rgba(255, 255, 255, .6);
      border: 4px solid var(--ink); border-radius: 24px;
      display: grid; place-items: center;
      overflow: hidden;
      position: relative;
    }
    .cat {
      width: 149px; height: 163px;   /* 시트 165×181 칸(앉은 모습, 2행 0번)을 0.9배 */
      background: url(assets/sprites/cat.png?v=8) 0 -163px / 891px 652px no-repeat;
      animation: bob 1.6s ease-in-out infinite;
    }
    .candies { position: absolute; inset: auto 0 10px; text-align: center; font-size: 30px; letter-spacing: 4px; }
    .card h2 { margin: 16px 0 4px; font-size: clamp(32px, 7vw, 44px); font-weight: normal; text-align: center; }
    .card p { margin: 0; font-size: clamp(18px, 4vw, 24px); text-align: center; text-wrap: balance; word-break: keep-all; }
    .play {
      margin-top: 16px;
      background: #fff; border: 5px solid var(--ink); border-radius: 999px;
      box-shadow: 0 6px 0 var(--ink);
      padding: 8px 36px; font-size: 30px;
    }
    .peng {
      width: 158px; height: 157px;   /* 펭귄 시트 166×165 칸(정면 만세, 2행 0번)을 0.95배 */
      background: url(assets/sprites/penguin.png?v=8) 0 -157px / 946px 941px no-repeat;
      animation: bob 1s ease-in-out infinite;
    }
    .snow { position: absolute; inset: auto 0 10px; text-align: center; font-size: 26px; letter-spacing: 6px; }
    .card.penguin .art { background: linear-gradient(180deg, rgba(255,255,255,.7) 60%, #ffffff 60%); }
    .chef-cat {
      width: 149px; height: 163px;   /* 고양이 시트 만세(3행 3번)를 0.9배 */
      background: url(assets/sprites/cat.png?v=8) -445.5px -325.8px / 891px 652px no-repeat;
      animation: bob 1.2s ease-in-out infinite;
    }
    .dumplings { position: absolute; inset: auto 0 10px; text-align: center; font-size: 30px; letter-spacing: 4px; }
    .card.kitchen .art { background: linear-gradient(180deg, rgba(255,255,255,.7) 62%, #f3d9ad 62%); }
    .new { position: absolute; top: 10px; right: 10px; background: #ff5c8a; color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 2px 10px; font-size: 18px; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .cat, .peng, .chef-cat { animation: none; } }
  </style>
</head>
<body>
  <header>
    <div class="coins" aria-label="모은 코인"><span class="coin"></span><b id="coin-count">0</b></div>
  </header>
  <h1><span>냥냥</span> 수학 놀이터</h1>
  <p class="sub">어떤 게임을 할까?</p>

  <main class="cards">
    <a class="card candy" href="candy.html">
      <div class="art"><div class="cat" role="img" aria-label="고양이 냥이"></div><div class="candies">🍬🍭🍬</div></div>
      <h2>냥냥 사탕 공장</h2>
      <p>사탕을 담아서 손님에게 배달해요</p>
      <span class="play">시작!</span>
    </a>

    <a class="card penguin" href="penguin.html">
      <div class="art">
        <div class="peng" role="img" aria-label="만세하는 펭귄"></div>
        <div class="snow">🐟 ❄️ 🐟</div>
      </div>
      <h2>펭귄 남극탐험</h2>
      <p>정답 깃발이 있는 길로 달려요</p>
      <span class="play">시작!</span>
    </a>

    <a class="card kitchen" href="kitchen.html">
      <div class="art">
        <div class="chef-cat" role="img" aria-label="신난 고양이 요리사"></div>
        <div class="dumplings">🥟 🍡 🍪</div>
        <span class="new">NEW · 2인</span>
      </div>
      <h2>냥냥 주방</h2>
      <p>만두·꼬치·쿠키를 굽고 배달해요 (1인 · 2인)</p>
      <span class="play">시작!</span>
    </a>
  </main>

  <script>
    try { document.getElementById('coin-count').textContent = JSON.parse(localStorage.getItem('nyang.coins')) || 0; } catch (e) { /* 저장소 없음 */ }
  </script>
</body>
</html>
