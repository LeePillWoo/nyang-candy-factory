<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff1d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>냥냥 주방</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20">
  <link rel="stylesheet" href="kitchen.css?v=20">
</head>
<body class="kitchen">
  <div id="stage">
    <!-- 주방 장면 (손님 · 요리사 · 상자 · 불 · 쓰레기통) — 화면을 눌러 요리사를 움직인다 -->
    <canvas id="scene"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <a id="btn-games" class="chip" href="./" aria-label="게임 고르기 (처음 화면)">🏠</a>
      <button id="btn-home" class="chip" aria-label="뒤로 (게임 로비)" hidden>🔙</button>
      <button id="btn-sound" class="chip" aria-label="소리">🔊</button>
      <div id="clock" class="chip" hidden><span aria-hidden="true">⏱</span><b id="clock-text">2:30</b></div>
      <div id="combo" class="chip" hidden></div>
      <div id="served" class="chip" hidden><span aria-hidden="true">🥟</span><b id="served-count">0</b></div>
      <div id="coins" class="chip coins"><span class="coin"></span><b id="coin-count">0</b></div>
    </div>

    <div id="banner" hidden></div>

    <!-- 거스름돈: 손님이 낸 돈 − 음식값 -->
    <div id="pay" hidden>
      <p class="pay-q">🪙 <b class="pay-paid">10</b>코인 냈어요 · 음식은 <b class="pay-price">7</b>코인</p>
      <p class="pay-ask">거스름돈은 얼마?</p>
      <div class="pay-choices"></div>
    </div>

    <!-- 시작 화면 -->
    <section id="menu" class="screen">
      <div class="panel">
        <h1 class="title"><span>냥냥</span> 주방</h1>
        <p class="sub">손님 주문만큼 구워서 배달해요!</p>
        <div class="dishes" aria-label="오늘의 메뉴"></div>
        <ol class="steps">
          <li><b>🕹️</b>꾹 누르고 밀어서 걷기</li>
          <li><b>📦</b>상자 옆에서 눌러 담기</li>
          <li><b>🔥</b>화덕에서 굽고 들기</li>
          <li><b>🐻</b>손님 앞에서 배달!</li>
        </ol>
        <div class="players" role="radiogroup" aria-label="몇 명이 할까요">
          <button class="player-pick" data-players="1" aria-checked="true"><span class="pp-icon">🐱</span><span>혼자 하기</span></button>
          <button class="player-pick" data-players="2" aria-checked="false"><span class="pp-icon">🐱🐧</span><span>둘이 하기</span></button>
        </div>
        <p class="howto duo-note">둘이 하기: 화면 왼쪽을 누르면 1P 냥이, 오른쪽을 누르면 2P 펭귄 조이스틱. 손님은 함께 받아요!</p>
        <div class="modes">
          <button class="btn mode add" data-mode="add"><span class="sign">+</span><span>덧셈</span></button>
          <button class="btn mode sub" data-mode="sub"><span class="sign">−</span><span>뺄셈</span></button>
          <button class="btn mode mul" data-mode="mul"><span class="sign">×</span><span>곱셈</span></button>
          <button class="btn mode div" data-mode="div"><span class="sign">÷</span><span>나눗셈</span></button>
          <button class="btn mode ten" data-mode="ten"><span class="sign">10</span><span>10 만들기</span></button>
        </div>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="result" class="screen" hidden>
      <div class="panel">
        <h2 class="title small">영업 끝!</h2>
        <div class="stars"></div>
        <p class="served-line"></p>
        <p class="dish-line"></p>
        <p class="team-line"></p>
        <p class="unlock-line"></p>
        <p class="best-line"></p>
        <p class="earned"></p>
        <div class="row">
          <button class="btn go again">한 번 더!</button>
          <button class="btn go home">처음으로</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 배포할 때 v 값을 올리면 모든 파일이 한꺼번에 새로 받아진다 -->
  <script type="importmap">
  {
    "imports": {
      "./src/audio.js": "./src/audio.js?v=20",
      "./src/problems.js": "./src/problems.js?v=20",
      "./src/viewport.js": "./src/viewport.js?v=20",
      "./src/sprites.js": "./src/sprites.js?v=20",
      "./src/characters.js": "./src/characters.js?v=20",
      "./src/save.js": "./src/save.js?v=20",
      "./src/learn.js": "./src/learn.js?v=20",
      "./src/missions.js": "./src/missions.js?v=20",
      "./src/shop.js": "./src/shop.js?v=20",
      "./src/kitchen/draw.js": "./src/kitchen/draw.js?v=20"
    }
  }
  </script>
  <script type="module" src="src/kitchen/game.js?v=20"></script>
</body>
</html>
